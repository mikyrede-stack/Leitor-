<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Fotos</title>
<style>
:root{--bg:#faf7f2;--fg:#1d1b19;--muted:#7a746c;--card:#fff;--accent:#e0576f;--shadow:0 8px 30px rgba(0,0,0,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--fg:#f3eee8;--muted:#9a938a;--card:#1e1c1a;--shadow:0 8px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#121110;--fg:#f3eee8;--muted:#9a938a;--card:#1e1c1a;--shadow:0 8px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;min-height:100vh}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:40}
#modeBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:40;width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .35s,opacity .3s}
#modeBtn svg{width:22px;height:22px}
#modeBtn:active{transform:rotate(-20deg) scale(.92)}
#modeBtn.gone{transform:translateY(-90px) scale(.5);opacity:0;pointer-events:none}
main{max-width:640px;margin:0 auto;padding:72px 14px 0}
.item{position:relative;margin:0 0 18px;border-radius:18px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);opacity:0;transform:translateY(40px) scale(.97);transition:opacity .6s,transform .6s}
.item.in{opacity:1;transform:none}
.item img{display:block;width:100%;height:auto}
.del{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:none}
body.edit .del{display:block}
#empty{text-align:center;padding:30vh 24px 0;color:var(--muted);line-height:1.5}
#empty b{display:block;font-size:48px;margin-bottom:8px}
#end{max-width:640px;margin:0 auto;padding:30px 14px 80px;text-align:center}
#end p{color:var(--muted);font-size:15px;letter-spacing:.04em;margin:0 0 18px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font-size:16px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;box-shadow:var(--shadow);margin:6px}
.btn.alt{background:var(--card);color:var(--fg)}
.btn:active{transform:scale(.95)}
#addBtn,#addBig{display:none}
body.edit #addBtn{display:inline-flex}
body.edit.vazio #addBig{display:inline-flex;margin-top:18px}
#count{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--card);color:var(--fg);padding:6px 14px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);z-index:30;opacity:0;transition:opacity .3s}
#count.on{opacity:.92}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:50;padding:20px}
.modal.on{display:grid}
.box{background:var(--card);border-radius:22px;padding:24px;max-width:360px;width:100%;box-shadow:var(--shadow);animation:pop .3s}
.box h2{margin:0 0 10px;font-size:20px}
.box p{margin:0 0 20px;color:var(--muted);line-height:1.5;font-size:15px}
.row{display:flex;gap:10px}
.row .btn{flex:1;justify-content:center;margin:0}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translate(-50%,-20px);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;top:-30px;pointer-events:none;z-index:60;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg);opacity:.7}}
#lock{--k:clamp(60px,19vw,76px);position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;transition:opacity .5s,transform .5s}
#lock.out{opacity:0;transform:scale(1.06);pointer-events:none}
body.locked{overflow:hidden}
.lk{width:46px;height:46px;color:var(--fg);margin-bottom:12px}
.lk .sh{transition:transform .4s;transform-origin:16px 11px}
.lk.open .sh{transform:translateY(-3px) rotate(-14deg)}
.lk.open{color:#2fbf71}
#lbl{font-size:11px;letter-spacing:.25em;color:var(--muted);height:16px;transition:color .2s}
#lbl.err{color:#e5383b;font-weight:600}
#dsp{height:56px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:34px;font-weight:600;min-width:200px;margin-bottom:26px}
#dsp span{display:inline-block;width:.7em;text-align:center;animation:ap .28s ease-out}
#dsp span.sq{animation:sq .25s}
#dsp.err{color:#e5383b;animation:shk .45s}
#dsp.ok{color:#2fbf71}
#dsp:empty::before{content:"";width:2px;height:30px;background:var(--muted);opacity:.5;animation:car 1s infinite}
@keyframes ap{from{transform:scale(.3) translateY(8px);opacity:0}60%{transform:scale(1.25)}}
@keyframes sq{50%{transform:scale(.65)}}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes car{50%{opacity:0}}
.pad{display:grid;grid-template-columns:repeat(3,var(--k));gap:14px}
.k{width:var(--k);height:var(--k);border-radius:50%;border:0;background:var(--card);color:var(--fg);font-size:26px;font-weight:500;box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;transition:transform .12s,background .3s,opacity .3s}
.k:active{transform:scale(.88)}
.k svg{width:26px;height:26px}
.k.bk{background:transparent;box-shadow:none;color:var(--muted)}
#go{background:#9a958d;color:#fff;box-shadow:none;opacity:.55;cursor:default}
#go.on{background:#2fbf71;opacity:1;cursor:pointer;box-shadow:0 6px 20px rgba(47,191,113,.45);animation:ready .45s}
@keyframes ready{50%{transform:scale(1.15)}}
</style>
</head>
<body class="edit vazio">
<div id="lock" role="dialog" aria-label="Senha">
  <svg class="lk" id="lkIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path class="sh" d="M8 11V7.5a4 4 0 0 1 8 0V11"/><circle cx="12" cy="16" r="1.2" fill="currentColor"/></svg>
  <div id="lbl">data</div>
  <div id="dsp"></div>
  <div class="pad" id="pad"></div>
</div>
<div id="prog"></div>
<button id="modeBtn" aria-label="Trocar de modo"></button>

<main id="feed"></main>

<div id="empty"><b>📷</b>Nenhuma foto ainda.<br>Adicione as primeiras para começar!<br><button class="btn" id="addBig">＋ Adicionar fotos</button></div>

<section id="end" hidden>
  <p>Fim de imagens</p>
  <button class="btn" id="addBtn">＋ Adicionar fotos</button>
  <button class="btn alt" id="topBtn">↑ Voltar ao topo</button>
</section>

<div id="count"></div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" multiple hidden>

<div class="modal" id="modal">
  <div class="box">
    <h2>Deseja ir para o modo histórico?</h2>
    <p>A qualquer momento você pode trocar para o modo editável no ícone de lápis, no topo da tela.</p>
    <div class="row"><button class="btn alt" id="nao">Não</button><button class="btn" id="sim">Sim</button></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const feed = $('#feed'), end = $('#end'), body = document.body;
const PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';

let db = null, photos = [], edit = true, cur = 0, shown = false;

/* ---------- armazenamento (as fotos ficam salvas no navegador) ---------- */
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('fotos-feed', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('p', {keyPath:'id', autoIncrement:true});
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const dbPut = blob => new Promise((res, rej) => { const q = db.transaction('p','readwrite').objectStore('p').put({blob}); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const dbAll = () => new Promise((res, rej) => { const q = db.transaction('p').objectStore('p').getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const dbDel = id => { try { db.transaction('p','readwrite').objectStore('p').delete(id); } catch(e){} };

/* ---------- observadores ---------- */
const reveal = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) e.target.classList.add('in');
}), {threshold:.1});

const current = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ cur = [...feed.children].indexOf(e.target) + 1; updateCount(); }
}), {threshold:.5});

new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting && photos.length && !shown){ shown = true; confetti(); }
  if (!e.isIntersecting) shown = false;
}), {threshold:.9}).observe(end);

/* ---------- interface ---------- */
function addItem(p){
  const d = document.createElement('div');
  d.className = 'item';
  d.innerHTML = '<img alt="Foto"><button class="del" aria-label="Remover foto">×</button>';
  d.querySelector('img').src = p.url;
  d.querySelector('.del').onclick = () => {
    photos = photos.filter(x => x !== p);
    dbDel(p.id); d.remove(); URL.revokeObjectURL(p.url); update();
  };
  feed.appendChild(d);
  reveal.observe(d); current.observe(d);
}

function update(){
  body.classList.toggle('edit', edit);
  body.classList.toggle('vazio', !photos.length);
  $('#empty').hidden = photos.length > 0;
  end.hidden = !photos.length;
  $('#modeBtn').innerHTML = edit ? EYE : PENCIL;
  $('#modeBtn').title = edit ? 'Ir para o modo histórico' : 'Voltar ao modo editável';
  updateCount();
  try { localStorage.setItem('modo', edit ? 'edit' : 'hist'); } catch(e){}
}
function updateCount(){
  const c = $('#count');
  c.textContent = cur + ' / ' + photos.length;
  c.classList.toggle('on', photos.length > 1);
}

async function addFiles(files){
  const list = [...files].filter(f => f.type.startsWith('image/'));
  for (const f of list){                       // mantém a ordem da seleção
    let id = Date.now() + Math.random();
    try { if (db) id = await dbPut(f); } catch(e){}
    const p = {id, url: URL.createObjectURL(f)};
    photos.push(p); addItem(p);
  }
  update();
  if (list.length) $('#modal').classList.add('on');
}

function toast(t){
  const el = $('#toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1400);
}
function confetti(){
  for (let i = 0; i < 36; i++){
    const s = document.createElement('i');
    s.className = 'cf';
    s.textContent = ['✨','🎉','💖','⭐','🌸'][i % 5];
    s.style.cssText = `left:${Math.random()*100}vw;--dx:${(Math.random()-.5)*200}px;animation-delay:${Math.random()*.4}s;font-size:${14+Math.random()*16}px`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2800);
  }
}

/* ---------- eventos ---------- */
$('#file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('#addBtn').onclick = $('#addBig').onclick = () => $('#file').click();
$('#topBtn').onclick = () => window.scrollTo({top:0, behavior:'smooth'});
$('#modeBtn').onclick = () => { edit = !edit; update(); toast(edit ? '✏️ Modo editável' : '📖 Modo histórico'); };
$('#nao').onclick = () => $('#modal').classList.remove('on');
$('#sim').onclick = () => { edit = false; $('#modal').classList.remove('on'); update(); toast('📖 Modo histórico'); };

addEventListener('scroll', () => {
  const m = document.documentElement.scrollHeight - innerHeight;
  $('#prog').style.width = (m > 0 ? scrollY / m * 100 : 0) + '%';
}, {passive:true});

/* duplo toque rápido: esconde / mostra o botão de lápis */
let last = 0;
document.addEventListener('pointerup', e => {
  if (e.target.closest('button, .modal, #lock')) return;
  const now = Date.now();
  if (now - last < 320){
    const g = $('#modeBtn').classList.toggle('gone');
    toast(g ? '🙈 Botão escondido' : '👀 Botão de volta!');
    last = 0;
  } else last = now;
});

/* ---------- início ---------- */
(async () => {
  try { edit = localStorage.getItem('modo') !== 'hist'; } catch(e){}
  try {
    db = await openDB();
    const saved = await dbAll();
    saved.forEach(r => { const p = {id:r.id, url:URL.createObjectURL(r.blob)}; photos.push(p); addItem(p); });
  } catch(e){ db = null; }
  update();
})();
/* ---------- tela de senha ---------- */
(() => {
  const HASH = 8548681831792405;
  const h = (str, seed = 0) => { let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed; for (let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909); return 4294967296 * (2097151 & h2) + (h1 >>> 0); };
  const lock = $('#lock'), dsp = $('#dsp'), lbl = $('#lbl'), pad = $('#pad'), ic = $('#lkIcon');
  try { if (sessionStorage.getItem('ok') === '1'){ lock.remove(); return; } } catch(e){}
  body.classList.add('locked');

  const BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M14 9.5l5 5M19 9.5l-5 5"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  let code = '', busy = false, tm;

  const mk = (cls, html, fn) => { const b = document.createElement('button'); b.className = 'k ' + cls; b.innerHTML = html; b.onclick = fn; pad.appendChild(b); return b; };
  for (let n = 1; n <= 9; n++) mk('', n, () => press(String(n)));
  mk('bk', BACK, back);
  mk('', 0, () => press('0'));
  const go = mk('', CHECK, submit); go.id = 'go';

  function mask(s){ if (!s || s.textContent === '*') return; s.textContent = '*'; s.classList.remove('sq'); void s.offsetWidth; s.classList.add('sq'); }
  function upd(){ go.classList.toggle('on', code.length >= 2); }
  function press(d){
    if (busy || code.length >= 12) return;
    mask(dsp.lastElementChild);
    code += d;
    const s = document.createElement('span'); s.textContent = d; dsp.appendChild(s);
    clearTimeout(tm); tm = setTimeout(() => mask(dsp.lastElementChild), 1500);
    upd();
  }
  function back(){
    if (busy || !code) return;
    code = code.slice(0, -1); dsp.lastElementChild.remove(); clearTimeout(tm); upd();
  }
  function submit(){
    if (busy || code.length < 2) return;
    busy = true; clearTimeout(tm); mask(dsp.lastElementChild);
    if (h('fotos:' + code) === HASH){
      dsp.classList.add('ok'); ic.classList.add('open');
      try { sessionStorage.setItem('ok', '1'); } catch(e){}
      setTimeout(() => { lock.classList.add('out'); body.classList.remove('locked'); setTimeout(() => lock.remove(), 600); }, 650);
    } else {
      dsp.classList.add('err'); lbl.textContent = 'senha errada'; lbl.classList.add('err');
      try { navigator.vibrate(60); } catch(e){}
      setTimeout(() => { code = ''; dsp.innerHTML = ''; dsp.classList.remove('err'); lbl.textContent = 'data'; lbl.classList.remove('err'); upd(); busy = false; }, 1300);
    }
  }
})();
</script>
</body>
</html>
